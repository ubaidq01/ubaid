<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Background rounded square -->
  <rect width="64" height="64" rx="16" fill="#080B14" stroke="#00D9FF" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Grid accent -->
  <path d="M 0 32 H 64 M 32 0 V 64" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <!-- UQ Monogram -->
  <g filter="url(#glow)">
    <!-- U -->
    <path d="M 16 20 V 36 C 16 42, 26 42, 26 36 V 20" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Q -->
    <ellipse cx="44" cy="31" rx="10" ry="11" fill="none" stroke="#00D9FF" stroke-width="4" />
    <path d="M 47 38 L 54 45" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
